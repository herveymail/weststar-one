{% load ws %}{% if not tickets %}<div class="empty">No tickets for this client.</div>{% else %}
<div class="table-wrap"><table class="grid"><tbody>
{% for t in tickets %}<tr>
  <td class="small muted num" style="width:90px"><a href="/tickets/{{ t.pk }}/?filter=all">{{ t.number }}</a></td>
  <td class="strong"><a href="/tickets/{{ t.pk }}/?filter=all" style="color:inherit;text-decoration:none">{{ t.subject }}</a></td>
  <td><span class="pill {{ t.priority|prio_class }}">{{ t.priority }}</span></td>
  <td><span class="pill {{ t.status|pill_tone }}">{{ t.status }}</span></td>
</tr>{% endfor %}
</tbody></table></div>{% endif %}
