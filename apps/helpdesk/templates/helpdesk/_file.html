{% load ws %}{% if u.ext in "png jpg jpeg gif webp" %}<a href="/files/{{ u.pk }}/?view=1" target="_blank" rel="noopener"><img class="thumb" src="/files/{{ u.pk }}/?view=1" alt="{{ u.original_name }}" loading="lazy"></a>{% else %}<a class="file-chip" href="/files/{{ u.pk }}/">{% icon "file" 14 %}{{ u.original_name }} <span class="muted">{{ u.size|filesizeformat }}</span></a>{% endif %}
