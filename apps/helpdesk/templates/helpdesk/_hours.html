{% if t.site_hours %}<div class="tk-hours"><b>Business hours:</b> {{ t.site_hours }}{% if open is True %} <span class="pill good">Open now</span>{% elif open is False %} <span class="pill warn">Closed now</span>{% endif %}</div>
{% elif missing %}<div class="tk-hours missing" role="alert"><b>No business hours on this call.</b> Ask the client when they're open.
  {% if can_edit %}<form method="post" action="/tickets/{{ t.pk }}/hours/" class="row" style="gap:6px;margin-top:6px"{% if where == "panel" %} hx-post="/tickets/{{ t.pk }}/hours/" hx-target="#panel" hx-swap="outerHTML"{% endif %}><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><input type="hidden" name="ctx" value="{{ where }}">
    <label class="sr" for="th-{{ t.pk }}">Business hours</label><input id="th-{{ t.pk }}" name="site_hours" class="input" maxlength="255" required placeholder="e.g. Mon–Fri 8–5" style="flex:1 1 200px"><button class="btn small primary">Save</button></form>{% endif %}</div>{% endif %}
