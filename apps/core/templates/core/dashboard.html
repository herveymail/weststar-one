{% extends "base.html" %}{% load ws %}
{% block content %}
<div class="dash-head">
  <h1>{{ greeting }}, {{ user.get_short_name }}</h1>
  <span class="muted">{% now "l, M j" %}</span>
  <span class="dash-live" title="Updates every 30 seconds"><span class="dot"></span>Live</span>
</div>
<div id="dash-live" hx-get="/?part=live" hx-trigger="every 30s" hx-swap="innerHTML">{% include "core/_dashboard_live.html" %}</div>
{% endblock %}
