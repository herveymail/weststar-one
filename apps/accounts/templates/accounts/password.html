{% extends "plain.html" %}
{% block heading %}Choose a new password{% endblock %}
{% block sub %}<p class="desc">At least 12 characters. A short sentence works well.</p>{% endblock %}
{% block inner %}
<form method="post" class="stack">{% csrf_token %}
  {% if error %}<div class="banner" role="alert">{{ error }}</div>{% endif %}
  <div class="field"><label for="cur">{% if forced %}Current (temporary) password{% else %}Current password{% endif %}</label><input id="cur" name="current" class="input" type="password" autocomplete="current-password" required></div>
  <div class="field"><label for="new">New password</label><input id="new" name="new" class="input" type="password" autocomplete="new-password" minlength="12" required></div>
  <div class="field"><label for="again">New password again</label><input id="again" name="again" class="input" type="password" autocomplete="new-password" minlength="12" required></div>
  <button class="btn primary">Save password</button>
  {% if not forced %}<a href="/settings/my_security/" class="link-btn">Cancel</a>{% endif %}
</form>
{% endblock %}
