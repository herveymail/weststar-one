<header class="top">
  <nav aria-label="{{ company }}">
    <span class="brand">{% if logo_url %}<img src="{{ logo_url }}" alt="{{ company }}" style="max-height:36px;max-width:180px">{% else %}{{ company }}{% endif %}</span>
    <span class="grow"></span>
    {% if lb_phone %}<a class="portal-user" href="tel:{{ lb_tel }}"><i class="bi bi-telephone" aria-hidden="true"></i> {{ lb_phone }}</a>{% endif %}
  </nav>
</header>
