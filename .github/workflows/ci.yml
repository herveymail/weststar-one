name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ws, POSTGRES_PASSWORD: ws_dev, POSTGRES_DB: weststar_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ws" --health-interval 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: legacy, MARIADB_USER: legacy, MARIADB_PASSWORD: legacy }
        ports: ['3306:3306']
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Legacy schema for the importer test
        run: |
          sudo apt-get install -y -q php-cli php-mysql mariadb-client >/dev/null
          git clone --depth 1 "https://x-access-token:${{ secrets.MYFLOW_READ_TOKEN }}@github.com/herveymail/myflow.git" /tmp/myflow || echo "no legacy repo access — importer test will be skipped"
          if [ -f /tmp/myflow/database/schema.sql ]; then
            mysql -h127.0.0.1 -uroot -proot legacy < /tmp/myflow/database/schema.sql
            for f in /tmp/myflow/database/migrations/*.sql; do mysql -h127.0.0.1 -uroot -proot -f legacy < "$f" >/dev/null 2>&1 || true; done
            echo "LEGACY_MYSQL_URL=mysql://root:root@127.0.0.1:3306/legacy" >> "$GITHUB_ENV"
          fi
      - name: Test
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://ws:ws_dev@127.0.0.1:5432/weststar_test
          APP_URL: http://localhost:3000
          SERVE_WEB: 'false'
          LOG_LEVEL: silent
        run: |
          export APP_ENCRYPTION_KEY=$(openssl rand -base64 32)
          sed -i "s/new mysqli('localhost', 'root', ''/new mysqli('127.0.0.1', 'root', 'root'/" test/fixtures/legacy-seed.php
          pnpm test
      - run: pnpm build
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high
