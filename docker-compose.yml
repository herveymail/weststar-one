# Weststar ONE — PostgreSQL, the app, the background jobs and Caddy (automatic HTTPS).
# Easiest: sudo bash install.sh   (the setup wizard does everything below for you)
#   1) cp .env.example .env   and fill it in
#   2) docker compose up -d --build
#   3) docker compose exec app python manage.py create_admin --email you@weststarmsp.com --name "Your Name"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weststar
      POSTGRES_USER: weststar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weststar -d weststar"]
      interval: 10s
      retries: 10
    # Not published to the host: only the app can reach the database.

  # Temporary MariaDB used ONLY while importing from the old PHP app (deploy/import-old.sh starts and
  # removes it). It holds a copy of the old database; your live old server is never touched.
  olddb:
    image: mariadb:11.8
    profiles: ["import"]
    environment:
      MARIADB_DATABASE: myflow_old
      MARIADB_USER: importer
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  app:
    build: .
    image: weststar-one:latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &appenv
      DEBUG: "false"
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      PORTAL_URL: ${PORTAL_URL:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      APP_ENCRYPTION_KEYS_OLD: ${APP_ENCRYPTION_KEYS_OLD:-}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: weststar
      DB_USER: weststar
      DB_PASSWORD: ${DB_PASSWORD}
      TRUST_PROXY: "true"
      TIME_ZONE: ${TIME_ZONE:-America/Denver}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LOG_LEVEL: INFO
    volumes: [media:/data/media]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  jobs:
    image: weststar-one:latest
    restart: unless-stopped
    depends_on: { app: { condition: service_healthy } }
    environment: *appenv
    command: ["jobs"]
    volumes: [media:/data/media]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}", PORTAL_DOMAIN: "${PORTAL_DOMAIN:-}" }
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes: { dbdata: {}, media: {}, caddydata: {}, caddyconfig: {} }
